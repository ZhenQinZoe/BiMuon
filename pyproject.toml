[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bimuon"
version = "0.1.0"
description = "Matrix-aware stochastic bilevel optimization"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
vision = ["torchvision>=0.15", "timm==1.0.12", "Pillow>=10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bimuon*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
